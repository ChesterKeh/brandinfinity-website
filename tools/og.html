<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0b0c;color:#fff;font-family:Lexend,sans-serif}
  .bg{position:absolute;inset:0;background:url(../assets/video/roborock-garfield.webp) 70% center/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0c 0%,rgba(11,11,12,.88) 40%,rgba(11,11,12,.2) 75%,rgba(11,11,12,.05))}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(120deg,#f26b1d,#d3121a 70%)}
  .in{position:absolute;left:72px;top:64px;bottom:64px;width:680px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:14px;font-weight:600;font-size:28px}
  .logo img{width:44px}
  h1{margin:auto 0 22px;font:800 84px/.92 Archivo,sans-serif;font-variation-settings:"wdth" 72;text-transform:uppercase}
  h1 span{background:linear-gradient(120deg,#f26b1d,#d3121a 70%);-webkit-background-clip:text;color:transparent}
  p{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
</style></head>
<body><div class="bg"></div><div class="shade"></div>
<div class="in">
  <div class="logo"><img src="../assets/mark.png" alt="">Brand Infinity</div>
  <h1>Your brand ×<br><span>the world's biggest stories</span></h1>
  <p>Film · Licensing · Gaming · Streaming</p>
</div><div class="bar"></div></body></html>
